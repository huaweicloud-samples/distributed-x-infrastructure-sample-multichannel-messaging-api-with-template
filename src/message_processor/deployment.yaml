apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-processor
  namespace: default
  labels:
    app: message-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: message-processor
  template:
    metadata:
      labels:
        app: message-processor
    spec:
      containers:
      - name: message-processor
        image: swr.cn-north-4.myhuaweicloud.com/multichannel-messaging/message-processor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "replace-with-terraform-output-kafka-servers"
        - name: KAFKA_TOPIC
          value: "messages"
        - name: KAFKA_GROUP_ID
          value: "message-processor"
        - name: GEMINIDB_ENDPOINT
          value: "replace-with-terraform-output-geminidb-endpoint"
        - name: GEMINIDB_USER
          value: "root"
        - name: GEMINIDB_PASSWORD
          value: "replace-with-your-password"
        - name: GEMINIDB_DATABASE
          value: "messaging"
        - name: SMTP_HOST
          value: "smtp.example.com"
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USER
          value: "your-smtp-user"
        - name: SMTP_PASSWORD
          value: "your-smtp-password"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: message-processor
  namespace: default
  labels:
    app: message-processor
spec:
  type: ClusterIP
  selector:
    app: message-processor
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: message-processor-config
  namespace: default
data:
  KAFKA_BOOTSTRAP_SERVERS: "replace-with-terraform-output-kafka-servers"
  KAFKA_TOPIC: "messages"
  GEMINIDB_DATABASE: "messaging"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
